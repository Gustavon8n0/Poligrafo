
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de Mentiras</title>
<style>
:root {
  --site-primary: #263c60;
  --site-on-primary: #ffffff;
  --site-secondary: #fff3c4;
  --site-on-secondary: #242424;
  --site-background: #e8eef5;
  --site-on-background: #172033;
  --site-font-body: Arial, Helvetica, sans-serif;
  --site-font-heading: Arial, Helvetica, sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  --surface: light-dark(#ffffff, #1b2230);
  --surface-text: light-dark(#172033, #f4f6fa);
  --border: light-dark(#d3dbe7, #414b5c);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--site-font-body);
  background: var(--site-background);
  color: var(--site-on-background);
}

#app {
  min-height: 100vh;
  width: 100%;
  background-color: var(--site-background);
  color: var(--site-on-background);
  padding: calc(24px * var(--site-spacing-scale));
  border-radius: 0;
}

.imagem {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 12px;
  margin: 15px 0;
}

main {
  max-width: 680px;
  margin: 0 auto;
  background: var(--surface);
  color: var(--surface-text);
  padding: calc(28px * var(--site-spacing-scale));
  border: 1px solid var(--border);
  border-radius: calc(18px * var(--site-radius-scale));
  box-shadow: 0 8px 26px #17203314;
}

h1 {
  font-family: var(--site-font-heading);
  font-size: calc(2rem * var(--site-heading-scale));
  color: var(--site-primary);
  margin: 0 0 8px;
}

.subtitle {
  margin: 0 0 22px;
  color: var(--surface-text);
  opacity: .78;
}

.scene {
  position: relative;
  min-height: 150px;
  display: grid;
  place-items: center;
  margin: 18px 0;
  padding: 24px;
  border-radius: calc(14px * var(--site-radius-scale));
  background: color-mix(in srgb, var(--site-secondary) 48%, transparent);
  border: 1px solid var(--border);
}

.bubble {
  width: 100%;
  background: var(--site-secondary);
  color: var(--site-on-secondary);
  border: 2px solid var(--site-primary);
  border-radius: calc(14px * var(--site-radius-scale));
  padding: 20px;
  font-weight: 700;
  font-size: 1.1rem;
  line-height: 1.5;
  text-align: center;
}

.counter {
  font-size: .95rem;
  opacity: .75;
  margin: 12px 0;
}

select, button {
  font: inherit;
  border-radius: calc(9px * var(--site-radius-scale));
  padding: 12px 15px;
}

select {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--surface-text);
  margin: 8px 0 10px;
}

button {
  border: 0;
  cursor: pointer;
  background: var(--site-primary);
  color: var(--site-on-primary);
  font-weight: 700;
  transition: transform .15s, opacity .15s;
}

button:hover {
  opacity: .9;
  transform: translateY(-1px);
}

button:focus-visible, select:focus-visible {
  outline: 3px solid #d69e2e;
  outline-offset: 3px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.actions button {
  flex: 1;
}

#restart {
  display: none;
  background: #35834b;
}

@media (max-width: 520px) {
  #app {
    padding: 14px;
  }

  main {
    padding: 20px;
  }

  h1 {
    font-size: calc(1.65rem * var(--site-heading-scale));
  }
}
</style>
</head>
<body>

<div id="app">
  <main>
    <h1>Detector de Mentiras</h1>
    <img src="image.png" alt="Cena de investigação criminal" class="imagem">

    <p class="subtitle">
      Teste de polígrafo: responda às perguntas com sinceridade.
    </p>

    <section class="scene" aria-live="polite">
      <div class="bubble" id="question">
        Prepare-se para iniciar o teste de polígrafo.
      </div>
    </section>

    <p class="counter" id="counter">Pergunta 1 de 10</p>

    <label for="answer">Sua resposta</label>

    <select id="answer">
      <option value="">Selecione sua resposta</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <div class="actions">
      <button id="submit" type="button">Responder</button>
      <button id="restart" type="button">Reiniciar</button>
    </div>
  </main>
</div>

<script>
const perguntas = [
  "Você conhece a vítima?",
  "Você esteve no local do crime?",
  "Você tinha algum motivo?",
  "Você discutiu com a vítima?",
  "Você estava perto do local?",
  "Você escondeu informações?",
  "Você conhece algum suspeito?",
  "Você mentiu para a polícia?",
  "Você sabe algo sobre o crime?",
  "Você participou do crime?"
];

let respostasSim = 0;
let atual = 0;

const pergunta = document.getElementById("question");
const numero = document.getElementById("counter");
const resposta = document.getElementById("answer");
const botaoResponder = document.getElementById("submit");
const botaoReiniciar = document.getElementById("restart");

function mostrarPergunta() {
  pergunta.textContent = perguntas[atual];

  numero.textContent =
    "Pergunta " + (atual + 1) + " de " + perguntas.length;
}

function responder() {
  if (resposta.value === "") {
    alert("Escolha uma resposta!");
    return;
  }

  if (resposta.value === "sim") {
    respostasSim++;
  }

  atual++;
  resposta.value = "";

  if (atual < perguntas.length) {
    mostrarPergunta();
  } else {
    mostrarResultado();
  }
}

function mostrarResultado() {
  let classificacao;
  let mensagem;

  if (respostasSim < 5) {
    classificacao = "Inocente";
    mensagem = "Poucos indícios encontrados.";
  } else if (respostasSim === 5) {
    classificacao = "Suspeito";
    mensagem = "Precisa ser investigado.";
  } else if (respostasSim <= 8) {
    classificacao = "Cúmplice";
    mensagem = "A investigação deve continuar.";
  } else {
    classificacao = "Culpado";
    mensagem = "As respostas precisam ser analisadas.";
  }

  pergunta.textContent =
    "Classificação: " + classificacao + ". " + mensagem;

  numero.textContent =
    "Respostas 'sim': " + respostasSim + " de " + perguntas.length;

  resposta.style.display = "none";
  botaoResponder.style.display = "none";

  document.querySelector('label[for="answer"]').style.display = "none";

  botaoReiniciar.style.display = "block";
}

function reiniciarJogo() {
  respostasSim = 0;
  atual = 0;

  resposta.style.display = "block";

  document.querySelector('label[for="answer"]').style.display = "block";

  botaoResponder.style.display = "block";
  botaoReiniciar.style.display = "none";

  mostrarPergunta();
}

botaoResponder.addEventListener("click", responder);
botaoReiniciar.addEventListener("click", reiniciarJogo);

mostrarPergunta();
</script>

</body>
</html>
